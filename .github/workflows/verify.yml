name: Verify private Hub
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the pinned client revision
        id: client
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          with open("Cargo.toml", "rb") as source:
              revision = tomllib.load(source)["dependencies"]["agit"]["rev"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"revision={revision}\n")
          PY
      - uses: actions/checkout@v4
        with:
          repository: binawoh/agent-git
          ref: ${{ steps.client.outputs.revision }}
          path: .cache/client
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y git-lfs musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo fmt --all --check
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: cargo build --locked --manifest-path .cache/client/Cargo.toml --bin agit
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/agit-selfhost
      - uses: actions/upload-artifact@v4
        with:
          name: test-client-${{ matrix.arch }}
          path: target/debug/agit
  package:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: server-x64
          path: .cache/x64
      - uses: actions/download-artifact@v4
        with:
          name: server-arm64
          path: .cache/arm64
      - name: Pack both static Linux architectures
        run: |
          python3 selfhost/npm/test_pack.py
          python3 selfhost/npm/pack.py --binary-x64 .cache/x64/agit-selfhost --binary-arm64 .cache/arm64/agit-selfhost --name @jooooesg/agit-selfhost --source-commit "$GITHUB_SHA" --output selfhost/artifacts/npm
      - uses: actions/upload-artifact@v4
        with:
          name: agit-selfhost-npm
          path: selfhost/artifacts/npm/
  compatibility:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: agit-selfhost-npm
          path: .cache/npm
      - uses: actions/download-artifact@v4
        with:
          name: test-client-${{ matrix.arch }}
          path: .cache/client
      - run: sudo apt-get update && sudo apt-get install -y git-lfs
      - name: Install and test the npm package on Ubuntu
        run: |
          chmod +x .cache/client/agit
          npm install --global --prefix "$RUNNER_TEMP/agentgit-install" --ignore-scripts --no-audit --no-fund --offline .cache/npm/*.tgz
          python3 selfhost/e2e.py --agit .cache/client/agit --server "$RUNNER_TEMP/agentgit-install/bin/agit-selfhost" --output selfhost/artifacts/e2e-${{ matrix.arch }}.json
          python3 selfhost/storage_e2e.py --server "$RUNNER_TEMP/agentgit-install/bin/agit-selfhost" --output selfhost/artifacts/storage-${{ matrix.arch }}.json
      - name: Test Debian and Alpine with native architecture containers
        run: |
          docker run --rm -v "$PWD:/work" -w /work node:22-bookworm-slim sh -ec 'apt-get update && apt-get install -y --no-install-recommends git python3; npm install --global --prefix /opt/agentgit --ignore-scripts --no-audit --no-fund --offline /work/.cache/npm/*.tgz; python3 selfhost/storage_e2e.py --server /opt/agentgit/bin/agit-selfhost --output selfhost/artifacts/debian-${{ matrix.arch }}.json'
          docker run --rm -v "$PWD:/work" -w /work node:22-alpine sh -ec 'apk add --no-cache git python3; npm install --global --prefix /opt/agentgit --ignore-scripts --no-audit --no-fund --offline /work/.cache/npm/*.tgz; python3 selfhost/storage_e2e.py --server /opt/agentgit/bin/agit-selfhost --output selfhost/artifacts/alpine-${{ matrix.arch }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-evidence-${{ matrix.arch }}
          path: selfhost/artifacts/*.json
